<svg width="100%" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cognitive Mobility Platform signal chain, sensitive details redacted</title>
<desc>Sensor inputs feed the Master Brain Transmitter, which links to the Slave Mobility Chassis. Specific technical details are redacted pending patent filing.</desc>

<rect x="0" y="0" width="1200" height="340" fill="#1a1a2e"/>

<!-- grid dots -->
<g fill="#2a2a45">
<circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/>
<circle cx="40" cy="300" r="1.5"/><circle cx="80" cy="300" r="1.5"/><circle cx="120" cy="300" r="1.5"/>
<circle cx="1080" cy="40" r="1.5"/><circle cx="1120" cy="40" r="1.5"/><circle cx="1160" cy="40" r="1.5"/>
<circle cx="1080" cy="300" r="1.5"/><circle cx="1120" cy="300" r="1.5"/><circle cx="1160" cy="300" r="1.5"/>
</g>

<text x="600" y="34" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#2DD4BF" letter-spacing="3">COGNITIVE MOBILITY PLATFORM &#8212; SIGNAL CHAIN</text>

<!-- Sensor inputs -->
<rect x="40" y="90" width="190" height="100" rx="6" fill="none" stroke="#3a6f68" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="60" y="112" width="150" height="16" rx="2" fill="#0c0c16"/>
<rect x="60" y="136" width="150" height="16" rx="2" fill="#0c0c16"/>
<text x="135" y="166" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#8b8ba3">signal acquisition</text>

<line x1="230" y1="140" x2="290" y2="140" stroke="#2DD4BF" stroke-width="1.5"/>
<polygon points="290,140 280,135 280,145" fill="#2DD4BF"/>

<!-- Master Brain Transmitter -->
<rect x="300" y="70" width="230" height="140" rx="8" fill="#14142380" stroke="#2DD4BF" stroke-width="1.5"/>
<text x="415" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#2DD4BF">MASTER BRAIN</text>
<text x="415" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#2DD4BF">TRANSMITTER</text>
<text x="415" y="142" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#8b8ba3">embedded controller</text>
<text x="415" y="160" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#8b8ba3">signal processing</text>
<rect x="368" y="168" width="94" height="14" rx="2" fill="#0c0c16"/>

<line x1="530" y1="140" x2="600" y2="140" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="538" y="120" width="54" height="14" rx="2" fill="#0c0c16"/>
<polygon points="600,140 590,135 590,145" fill="#2DD4BF"/>

<!-- Slave Mobility Chassis -->
<rect x="610" y="70" width="230" height="140" rx="8" fill="#14142380" stroke="#2DD4BF" stroke-width="1.5"/>
<text x="725" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#2DD4BF">SLAVE MOBILITY</text>
<text x="725" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#2DD4BF">CHASSIS</text>
<text x="725" y="142" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#8b8ba3">embedded controller</text>
<text x="725" y="160" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#8b8ba3">motion control</text>
<rect x="678" y="168" width="94" height="14" rx="2" fill="#0c0c16"/>

<line x1="725" y1="210" x2="725" y2="240" stroke="#2DD4BF" stroke-width="1.5"/>
<polygon points="725,240 720,230 730,230" fill="#2DD4BF"/>

<!-- Bottom row: motor driver + obstacle sensor -->
<rect x="610" y="250" width="105" height="60" rx="6" fill="none" stroke="#3a6f68" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="622" y="264" width="81" height="14" rx="2" fill="#0c0c16"/>
<text x="662" y="292" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#8b8ba3">motor driver</text>

<rect x="735" y="250" width="105" height="60" rx="6" fill="none" stroke="#3a6f68" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="747" y="264" width="81" height="14" rx="2" fill="#0c0c16"/>
<text x="787" y="292" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#8b8ba3">obstacle sense</text>

<!-- Status line -->
<rect x="880" y="130" width="280" height="60" rx="6" fill="none" stroke="#F4A261" stroke-width="1"/>
<text x="1020" y="155" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#F4A261">STATUS: PATENT PENDING</text>
<text x="1020" y="173" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#8b8ba3">wireless bionic mobility system</text>

<line x1="840" y1="140" x2="878" y2="140" stroke="#2DD4BF" stroke-width="1"/>

</svg>
